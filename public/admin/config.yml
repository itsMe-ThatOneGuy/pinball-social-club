backend:
  name: github
  repo: itsMe-ThatOneGuy/pinball-social-club
  branch: main

  base_url: https://decap-auth.invadernny.org
  auth_endpoint: /auth

media_folder: "public/images/events"
public_folder: "/images/events"

collections:
  - name: "events" # Used in routes, e.g., /admin/collections/blog
    label: "Events" # Used in the UI
    folder: "src/content/events" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}"
    fields: # The fields for each document, usually in frontmatter
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          label: "Doors Open",
          name: "doorTime",
          widget: "datetime",
          date_format: false,
          time_format: "h:mm A",
        }
      - {
          label: "Event Starts",
          name: "startTime",
          widget: "datetime",
          date_format: false,
          time_format: "h:mm A",
        }
      - {
          label: "Featured Image",
          name: "thumbnail",
          widget: "image",
          choose_url: false,
        }
      - { label: "Description", name: "body", widget: "markdown" }
