backend:
  name: github
  repo: itsMe-ThatOneGuy/pinball-social-club
  branch: main

  base_url: https://decap-auth.invadernny.org
  auth_endpoint: /auth

media_folder: "src/assets/uploads"
public_folder: "/src/assets/uploads"

collections:
  - name: "calendarItems" # Used in routes, e.g., /admin/collections/blog
    label: "Calendar Items" # Used in the UI
    folder: "src/content/calendar" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}"
    fields: # The fields for each document, usually in frontmatter
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Date(s)",
          name: "eventDates",
          widget: "list",
          field:
            {
              label: "Date",
              name: "date",
              widget: "datetime",
              date_format: "YYYY-MM-DD",
              time_format: false,
            },
        }
      - {
          label: "Doors Open",
          name: "doorTime",
          widget: "datetime",
          date_format: false,
          time_format: "h:mm A",
        }
      - {
          label: "Event Starts",
          name: "startTime",
          widget: "datetime",
          date_format: false,
          time_format: "h:mm A",
        }
      - { label: "Entry Fee", name: "entryFee", widget: "number" }
      - { label: "Prize Pool", name: "prize", widget: "string" }
      - {
          label: "Featured Image",
          name: "thumbnail",
          widget: "image",
          choose_url: false,
        }
      - {
          label: "Details",
          name: "details",
          widget: "richtext",
          buttons:
            [
              "bold",
              "italic",
              "heading-one",
              "heading-two",
              "heading-three",
              "heading-four",
              "heading-five",
              "heading-six",
              "quote",
              "bulleted-list",
            ],
          editor_components: [],
        }
